name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Install cloudflared
      # --------------------------------------------------
      - name: Install cloudflared
        run: |
          curl -L \
            --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb

          cloudflared --version

      # --------------------------------------------------
      # 2. Configure SSH
      # --------------------------------------------------
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$DEPLOY_SSH_KEY_B64" \
            | base64 --decode \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          cat > ~/.ssh/config << EOF
          Host more-apps-server
              HostName ${{ secrets.DEPLOY_HOST }}
              User ${{ secrets.DEPLOY_USER }}
              IdentityFile ~/.ssh/deploy_key
              IdentitiesOnly yes
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              ConnectTimeout 15
              ServerAliveInterval 30
              ServerAliveCountMax 3
              ProxyCommand env CLOUDFLARE_ACCESS_CLIENT_ID="$CLOUDFLARE_ACCESS_CLIENT_ID" CLOUDFLARE_ACCESS_CLIENT_SECRET="$CLOUDFLARE_ACCESS_CLIENT_SECRET" cloudflared access ssh --hostname %h
          EOF

          chmod 600 ~/.ssh/config

          echo "SSH configuration created."

      # --------------------------------------------------
      # 3. Test SSH connection
      # --------------------------------------------------
      - name: Test SSH connection
        run: |
          ssh -vvv more-apps-server \
            "echo 'SSH connection successful'"

      # --------------------------------------------------
      # 4. Deploy
      # --------------------------------------------------
      - name: Deploy
        run: |
          ssh more-apps-server << 'EOF'
            set -e

            cd /home/deploy/more-apps

            echo "========================================"
            echo "Pulling latest code..."
            echo "========================================"

            git pull origin master

            echo "========================================"
            echo "Checking Docker Compose configuration..."
            echo "========================================"

            docker compose config > /dev/null

            echo "========================================"
            echo "Building Docker image..."
            echo "========================================"

            docker compose build --pull

            echo "========================================"
            echo "Starting service..."
            echo "========================================"

            docker compose up -d

            echo "========================================"
            echo "Removing unused Docker images..."
            echo "========================================"

            docker image prune -f

            echo "========================================"
            echo "Deployment status:"
            echo "========================================"

            docker compose ps

            echo "========================================"
            echo "Server logs:"
            echo "========================================"

            docker compose logs --tail=50 server

            echo "========================================"
            echo "Deployment complete."
            echo "========================================"
          EOF
